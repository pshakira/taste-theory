name: build

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels a run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Testcontainers needs a container engine. GitHub's Ubuntu runners have
      # Docker preinstalled, so the tests get a real Postgres here exactly as
      # they do locally -- no separate service container to configure.
      - name: Build and test
        run: ./gradlew build --no-daemon

      # Only useful when something failed, so it is only kept then.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
