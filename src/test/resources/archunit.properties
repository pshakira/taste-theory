# A rule that currently matches no classes is not a failure here.
#
# The modules are being built one at a time, so for now most of these rules have
# nothing to check -- "no class in ..application.. may depend on
# ..infrastructure.." is trivially true while neither package holds any code.
# Without this, ArchUnit treats a rule that checked nothing as a mistake.
#
# Worth revisiting once all the modules exist, at which point an empty rule
# really would mean something was misnamed.
archRule.failOnEmptyShould=false
